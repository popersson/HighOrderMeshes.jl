name: Docs
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
permissions:
  contents: write
  pull-requests: read
  statuses: write
jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
